name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environment/requirements.lock.txt
      - name: Check tracked files for private artifacts
        run: python scripts/check_public_tree.py
      - name: Install pinned environment
        run: python -m pip install -r environment/requirements.lock.txt
      - name: Install application
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test public synthetic fixtures
        run: python -m pytest -m "not local_data" --cov=bioreactor_twin --cov-branch --cov-fail-under=100
      - name: Build package
        run: python -m build --no-isolation
      - name: Smoke test the synthetic demo
        run: |
          python scripts/make_demo_workbook.py --output tmp/demo.xlsx
          python -m bioreactor_twin audit tmp/demo.xlsx --output tmp/demo-audit.json
          python -c "from pathlib import Path; from bioreactor_twin.data.dataset import load_runs; assert set(load_runs(Path('tmp/demo.xlsx'))) == {101, 102, 103}"
