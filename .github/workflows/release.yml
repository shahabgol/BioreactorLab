name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tracked files for private artifacts
        run: python scripts/check_public_tree.py
      - name: Install pinned environment
        run: python -m pip install -r environment/requirements.lock.txt
      - name: Install application
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -m "not local_data" --cov=bioreactor_twin --cov-branch --cov-fail-under=100
      - name: Build candidate
        run: python -m build --no-isolation
      - uses: actions/upload-artifact@v7
        with:
          name: bioreactor-twin-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
