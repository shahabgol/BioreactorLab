[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioreactor-twin"
version = "0.1.0.dev0"
description = "Event-driven fed-batch bioreactor simulator and offline calibration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "dash>=3,<5",
  "plotly>=6,<7",
]

[project.urls]
Repository = "https://github.com/shahabgol/BioreactorLab"
Issues = "https://github.com/shahabgol/BioreactorLab/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.8,<1", "build>=1,<2", "pip-tools>=7,<8"]

[project.scripts]
bioreactor-twin = "bioreactor_twin.cli:main"
bioreactor-lab = "bioreactor_twin.web.app:main"

[tool.setuptools.package-data]
"bioreactor_twin.web" = ["assets/*.css", "assets/*.svg", "assets/*.gif"]

[tool.setuptools.packages.find]
where = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["main"]
addopts = "-ra --strict-markers"
markers = ["local_data: requires the original private source files"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
